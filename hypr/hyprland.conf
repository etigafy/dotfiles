# Entry point: Hyprland + waybar (the default session).
# Everything except the shell layer is shared with quickshell.conf.
#
# NOTE: while hyprland.lua exists, Hyprland 0.56 loads *that* for the default
# session and never reads this file -- `hyprctl systeminfo` reports
# "configProvider: lua". This hyprlang tree stays live for the Quickshell
# session, which is started explicitly with -c ~/.config/hypr/quickshell.conf,
# and as the fallback if hyprland.lua is removed.

source = ~/.config/hypr/common.conf
source = ~/.config/hypr/shell-waybar.conf
