# CachyOS-style lock screen (colors/layout mirror CachyOS's swaylock config)
$ring_color = rgba(00aa84ee)
$key_hl_color = rgba(82dcccee)
$fail_color = rgba(ff5555ee)
$inside_color = rgba(111826cc)
$text_color = rgba(ffffffff)

background {
    monitor =
    path = screenshot
    blur_passes = 5
    blur_size = 7
    noise = 0.02
    contrast = 0.9
    brightness = 0.65
    vibrancy = 0.2
    vibrancy_darkness = 0.5
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 100, 100
    position = 0, -20
    halign = center
    valign = center

    inner_color = $inside_color
    outer_color = $ring_color
    outline_thickness = 3
    rounding = -1

    font_family = CaskaydiaMono Nerd Font
    font_color = $text_color

    placeholder_text =
    check_color = $key_hl_color
    fail_color = $fail_color
    fail_text = <i>$PAMFAIL ($ATTEMPTS)</i>

    shadow_passes = 0
    fade_on_empty = false
}

label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    font_size = 90
    font_family = Cantarell
    color = $text_color

    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 22
    font_family = Cantarell
    color = $text_color

    position = 0, 90
    halign = center
    valign = center
}

auth {
    fingerprint:enabled = true
}
