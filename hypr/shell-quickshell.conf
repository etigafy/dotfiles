###################
### SHELL LAYER ###
###################
# Quickshell setup — used by quickshell.conf.
#
# NOTE: swaync is deliberately NOT started here. If your Quickshell config
# declares a NotificationServer, it and swaync both try to own the D-Bus name
# org.freedesktop.Notifications; the loser silently fails to register.
# Same applies to waybar's tray vs. a Quickshell SystemTray.
#
# Not starting swaync is not enough on its own, for two reasons:
#   1. swaync ships /usr/share/dbus-1/services/org.erikreider.swaync.service,
#      so the *bus* will spawn it on demand for anyone asking for
#      org.freedesktop.Notifications. Win that race and it never activates.
#   2. The user D-Bus session outlives an individual Hyprland session, and
#      exec-once children are not reliably reaped, so a swaync (or waybar)
#      from a previous waybar session can still be holding the name.
# Hence the pkill sweep before the shell starts. Quickshell re-attempts
# registration whenever the name is released, so order here is forgiving.

exec-once = pkill -x swaync; pkill -x mako; pkill -x waybar; hyprpaper & hypridle & quickshell

# Session menu (SessionMenu.qml) — the wlogout replacement. Quickshell-only, so
# it lives here rather than in common.conf; the waybar session keeps wlogout.
bindd = SUPER, X, Session menu, exec, qs ipc call session toggle
